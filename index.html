:root{
  --K:#080808;--K2:#111111;--K3:#1A1A1A;
  --rouge:#8B1A2A;--rouge2:#A82035;
  --or:#C8A96E;--or2:#D9BC8A;
  --ivoire:#F2EBE0;--iv2:rgba(242,235,224,0.72);--iv3:rgba(242,235,224,0.35);
}
`,tt=`
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;max-width:100%}
html{scroll-behavior:smooth;overflow-x:hidden}
body{font-family:'Jost',sans-serif;background:var(--K);color:var(--ivoire);overflow-x:hidden;-webkit-font-smoothing:antialiased;width:100%;position:relative}
img{display:block;width:100%;height:100%;object-fit:cover}
a{text-decoration:none}
section,div,header,footer,nav{max-width:100%;box-sizing:border-box}
.nav{position:fixed;top:0;left:0;right:0;width:100%;z-index:1000;display:flex;align-items:center;justify-content:space-between;padding:22px 48px;transition:all 0.4s}
.nav.on{background:rgba(8,8,8,0.97);backdrop-filter:blur(20px);padding:13px 48px;border-bottom:1px solid rgba(200,169,110,0.12)}
.nav-logo{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;letter-spacing:.2em;color:var(--ivoire);flex-shrink:0}
.nav-logo span{color:var(--or)}
.nav-links{display:flex;gap:22px;list-style:none}
.nav-links a{font-size:10.5px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--iv2);transition:color .3s;white-space:nowrap}
.nav-links a:hover,.nav-links a.act{color:var(--or)}
.nav-cta{font-family:'Jost',sans-serif;font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--K);background:var(--or);padding:12px 20px;border:none;cursor:pointer;white-space:nowrap}
.burger{display:none;background:none;border:none;cursor:pointer;color:var(--or);font-size:30px;padding:4px;line-height:1;z-index:1001;flex-shrink:0}
.mob{position:fixed;inset:0;background:rgba(8,8,8,0.99);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transform:translateX(100%);transition:transform 0.35s cubic-bezier(0.23,1,0.32,1);width:100%;max-width:100%;padding:20px}
.mob.open{transform:translateX(0)}
.mob a{font-family:'Cormorant Garamond',serif;font-size:clamp(24px,6vw,38px);font-weight:300;color:var(--ivoire);letter-spacing:.05em;transition:color .3s}
.mob a:hover{color:var(--or)}
.mob-btn{font-family:'Jost',sans-serif;font-size:12px;letter-spacing:.2em;text-transform:uppercase;background:var(--rouge);color:var(--ivoire);padding:16px 40px;margin-top:8px;border:none;cursor:pointer}
.wa{position:fixed;bottom:24px;right:24px;z-index:998;width:56px;height:56px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(37,211,102,0.4);transition:transform .3s}
.wa:hover{transform:scale(1.1)}
.wa svg{width:30px;height:30px;fill:white;max-width:none}
.bandeau{background:var(--rouge);padding:10px 20px;text-align:center;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ivoire);width:100%}
.bandeau a{color:var(--or2);margin-left:10px;font-weight:600}
.btn-A{font-family:'Jost',sans-serif;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;background:var(--rouge);color:var(--ivoire);padding:16px 32px;border:none;cursor:pointer;transition:background .3s;display:inline-block}
.btn-A:hover{background:var(--rouge2)}
.btn-B{font-family:'Jost',sans-serif;font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;background:transparent;color:var(--or);padding:16px 32px;border:1px solid rgba(200,169,110,0.4);cursor:pointer;transition:all .3s;display:inline-block}
.btn-B:hover{border-color:var(--or);background:rgba(200,169,110,0.08)}
.btn-W{font-family:'Jost',sans-serif;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;background:var(--ivoire);color:var(--rouge);padding:16px 32px;border:none;cursor:pointer;display:inline-block}
.lbl{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--or);margin-bottom:16px;display:flex;align-items:center;gap:12px}
.lbl::after{content:'';width:28px;height:1px;background:var(--or);opacity:.5}
.s-h{font-family:'Cormorant Garamond',serif;font-size:clamp(32px,5vw,58px);font-weight:400;line-height:1.05;color:var(--ivoire)}

          form.reset();
        } else {
          throw new Error((data && data.message) || "unknown");
        }
      })
      .catch(function () {
        msg.className = "cf-msg err";
        msg.innerHTML = "L'envoi a \u00e9chou\u00e9. R\u00e9essayez, ou \u00e9crivez-nous directement \u00e0 <a href=\"mailto:ufitlux@gmail.com\" style=\"color:var(--or,#C8A96E)\">ufitlux@gmail.com</a>.";
      })
      .then(function () {
        btn.disabled = false;
        btn.textContent = original;
      });
  }

  // ── Inject / remove depending on the current route ───────────────
  function sync() {
    var onContact = location.pathname.replace(/\/+$/, "") === ROUTE;
    var existing = document.getElementById(FORM_ID);

    if (!onContact) {
      if (existing) existing.remove();
      return;
    }
    if (existing && document.body.contains(existing)) return; // already there

    var anchor = document.querySelector(".contacts");
    if (!anchor || !anchor.parentNode) return; // contact content not mounted yet

    injectStyles();
    anchor.parentNode.insertBefore(buildForm(), anchor.nextSibling);
  }

  // ── Wire up: SPA navigation + React re-renders ───────────────────
  function start() {
    sync();

    // Patch history API to catch client-side navigation
    ["pushState", "replaceState"].forEach(function (m) {
      var orig = history[m];
      history[m] = function () {
        var r = orig.apply(this, arguments);
        window.dispatchEvent(new Event("ufit:navigate"));
        return r;
      };
    });
    window.addEventListener("popstate", schedule);
    window.addEventListener("ufit:navigate", schedule);

    // Re-inject if React re-renders the contact subtree and drops our node
    var root = document.getElementById("root") || document.body;
    if (window.MutationObserver) {
      new MutationObserver(schedule).observe(root, { childList: true, subtree: true });
    }
  }

  var pending = null;
  function schedule() {
    if (pending) return;
    pending = setTimeout(function () { pending = null; sync(); }, 120);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () { setTimeout(start, 300); });
  } else {
    setTimeout(start, 300);
  }
})();

</script>
</body>
</html>
